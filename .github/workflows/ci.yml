name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: misconfig
          POSTGRES_PASSWORD: misconfig
          POSTGRES_DB: misconfig_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U misconfig" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://misconfig:misconfig@localhost:5432/misconfig_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit, API and BDD tests (mocked AWS via moto, SQLite + PostgreSQL)
        run: pytest --cov=misconfig --cov-report=term-missing --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t aws-misconfig-detector .
