# Daily scan of a real AWS account using OIDC federation: no AWS keys are
# stored in GitHub. GitHub exchanges a short-lived OIDC token for temporary
# credentials of the IAM role in AWS_SCAN_ROLE_ARN (see README for setup).
name: Scheduled AWS scan

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC daily
  workflow_dispatch:
    inputs:
      remediate:
        description: "Apply auto-remediation (otherwise dry run)"
        type: boolean
        default: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: vars.AWS_SCAN_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SCAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Scan
        run: |
          python -m misconfig scan \
            --regions ${{ vars.SCAN_REGIONS || 'us-east-1' }} \
            --out report.json --log-file logs/scan.jsonl \
            ${{ inputs.remediate && '--remediate --apply' || '--remediate' }} \
            --fail-on CRITICAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report-${{ github.run_number }}
          path: |
            report.json
            logs/scan.jsonl
