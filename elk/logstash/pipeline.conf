# Reads the scanner's JSON-lines log and indexes each event into Elasticsearch.
# In Kibana, create a data view for "misconfig-*" and filter on event:finding.
input {
  file {
    path => "/var/log/misconfig/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => json
  }
}

filter {
  date { match => ["@timestamp", "ISO8601"] }
  if [event] == "finding" {
    mutate { add_tag => ["finding"] }
    translate {
      source => "severity"
      target => "severity_rank"
      dictionary => { "CRITICAL" => 4 "HIGH" => 3 "MEDIUM" => 2 "LOW" => 1 }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "misconfig-%{+YYYY.MM.dd}"
  }
}
