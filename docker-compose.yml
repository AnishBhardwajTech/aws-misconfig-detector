# Full stack: API + dashboard, PostgreSQL, and the ELK stack for scan logs.
#   docker compose up -d                -> dashboard on http://localhost:5000
#   docker compose --profile elk up -d  -> also Elasticsearch, Logstash, Kibana (http://localhost:5601)
# AWS credentials are read from your ~/.aws folder (read-only).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: misconfig
      POSTGRES_PASSWORD: misconfig
      POSTGRES_DB: misconfig
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misconfig"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://misconfig:misconfig@postgres:5432/misconfig
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - ~/.aws:/home/scanner/.aws:ro
      - scanlogs:/var/log/misconfig
    ports: ["5000:5000"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    profiles: [elk]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes:
      - ./elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - scanlogs:/var/log/misconfig:ro
    depends_on: [elasticsearch]
    profiles: [elk]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
    profiles: [elk]

volumes:
  pgdata:
  scanlogs:
